
[custom]
ruleset=🎯 全球直连,local_rule/url/LocalAreaNetwork.list
ruleset=🎯 全球直连,local_rule/url/UnBan.list
ruleset=特殊节点选择,local_rule/url/hight.list
ruleset=特殊节点选择,local_rule/url/AI.list
ruleset=通用节点选择,local_rule/url/GoogleFCM.list
ruleset=通用节点选择,local_rule/url/ProxyGFWlist.list
ruleset=通用节点选择,local_rule/url/medium.list
ruleset=🛑 广告拦截,local_rule/url/BanEasyList.list
ruleset=🎯 全球直连,local_rule/url/ChinaDomain.list
ruleset=🎯 全球直连,local_rule/url/ChinaCompanyIp.list
ruleset=🎯 全球直连,local_rule/url/GoogleCN.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL


# 总控池
custom_proxy_group=特殊节点选择`select`[]🛡 高可用`[]⚡ 量子`[]🐉 龙珠`[]🥚 宝可梦
custom_proxy_group=通用节点选择`select`[]🛡 高可用`[]⚡ 量子`[]🐉 龙珠`[]🥚 宝可梦


# 高可用池（按优先级自动切换：宝可梦 → 龙珠 → 量子）
custom_proxy_group=🛡 高可用`fallback`[]🥚 宝可梦`[]🐉 龙珠`[]⚡ 量子`http://www.gstatic.com/generate_204`300,1000,

# 机场池（每个机场全部节点自动测速，不分国家/专线）
custom_proxy_group=⚡ 量子`url-test`!!GROUP=quanx!!.*`[]兜底`http://www.gstatic.com/generate_204`300,,100
custom_proxy_group=🐉 龙珠`url-test`!!GROUP=longzhu!!.*`[]兜底`http://www.gstatic.com/generate_204`300,,100
custom_proxy_group=🥚 宝可梦`url-test`!!GROUP=pokemon!!.*`[]兜底`http://www.gstatic.com/generate_204`300,,100


# 容错兜底（防止机场筛选为空，REJECT 永远不可用以保证 fallback 正常切换）
custom_proxy_group=兜底`select`[]REJECT

# 兜底池
custom_proxy_group=🛑 广告拦截`select`[]DIRECT`[]REJECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]特殊节点选择`[]通用节点选择

enable_rule_generator=true
overwrite_original_rules=true

